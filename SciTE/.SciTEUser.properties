# ============================================================================
# 1. КОДИРОВКА UTF-8 ПО УМОЛЧАНИЮ (без BOM)
# ============================================================================
code.page=65001
character.set=204

# ============================================================================
# 2. ПОДКЛЮЧЕНИЕ ОБЪЕДИНЕННОГО LUA-СКРИПТА ЛЕКСЕРОВ
# ============================================================================
ext.lua.startup.script=$(SciteUserHome)/scite_lexers.lua

# ============================================================================
# 3. НАСТРОЙКИ ДЛЯ RAZOR (*.cshtml;*.razor) -> script_razor
# ============================================================================
file.patterns.razor=*.cshtml;*.razor
lexer.$(file.patterns.razor)=script_razor

style.script_razor.0=fore:#000000
style.script_razor.1=fore:#000080,bold
style.script_razor.2=fore:#008080
style.script_razor.3=fore:#A31515
style.script_razor.4=fore:#008000,italics
style.script_razor.5=fore:#800080,back:#F3E8FF,bold
style.script_razor.6=fore:#000080,bold
style.script_razor.7=fore:#FF6600

# Сборка и запуск .NET по F7 / F5 (опционально)
command.build.$(file.patterns.razor)=dotnet build
command.go.$(file.patterns.razor)=dotnet run
command.go.subsystem.$(file.patterns.razor)=0

# ============================================================================
# 4. НАСТРОЙКИ ДЛЯ TSX / JSX (*.tsx;*.jsx) -> script_tsx
# ============================================================================
file.patterns.tsx=*.tsx;*.jsx
lexer.$(file.patterns.tsx)=script_tsx

style.script_tsx.0=fore:#000000
style.script_tsx.1=fore:#000080,bold
style.script_tsx.2=fore:#008080
style.script_tsx.3=fore:#A31515
style.script_tsx.4=fore:#008000,italics
style.script_tsx.5=fore:#000080,bold
style.script_tsx.6=fore:#FF6600
style.script_tsx.7=fore:#800080,bold

# Проверка типов TypeScript по F7 (опционально)
command.build.$(file.patterns.tsx)=npx tsc --noEmit
